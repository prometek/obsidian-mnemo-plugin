repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: npx prettier --write
        types: [ts]
        stages: [pre-commit]

      - id: eslint
        name: eslint
        language: node
        entry: npx eslint --fix
        types: [ts]
        stages: [pre-commit]

      - id: commitlint
        name: commitlint
        language: node
        entry: npx commitlint --edit
        stages: [commit-msg]
